# quickstart-bluetooth application configuration (PLAN.md §4.3).
#
# peripheral_lbs base + Memfault observability over the MDS BLE gateway path.
# Deliberately de-OTA'd: no MCUboot / MCUmgr / SMP / sysbuild (PLAN.md §1).

# --- Base BLE + LBS ---------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# MDS access control needs a secured link
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="Quickstart_Bluetooth"
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Quickstart Bluetooth"
CONFIG_BT_LBS=y
CONFIG_BT_LBS_POLL_BUTTON=y
CONFIG_DK_LIBRARY=y

# --- MDS gateway path -------------------------------------------------------
# The device serves Memfault chunks to the gateway; no on-device HTTP/TLS.
CONFIG_BT_MDS=y
# Drain chunks ~1s for a snappy demo
CONFIG_BT_MDS_DATA_POLL_INTERVAL=1000

# --- Memfault core ----------------------------------------------------------
CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_SHELL=y
CONFIG_MEMFAULT_NCS_FW_TYPE="main"
# Firmware version is derived from app/VERSION (NPE-1773 / PLAN.md §4.5) — do
# NOT hardcode it. With STATIC selected and no explicit
# CONFIG_MEMFAULT_NCS_FW_VERSION, the version defaults to
# "$(APP_VERSION_TWEAK_STRING)" (e.g. 1.0.0+0) when app/VERSION exists.
CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC=y
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=60
CONFIG_MEMFAULT_EVENT_STORAGE_SIZE=4096
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP=y
# Measured on the LBS build with `mflt coredump_size` (NPE-1776): required 6980 B.
# Sized to 8192 B (~17% headroom). Memfault truncates an oversized dump
# (registers first) so a backtrace survives even if undersized.
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP_SIZE=8192

# --- Runtime project key (temporary fork feature; see west.yml) -------------
# A key stored at the settings key `memfault/project_key` overrides the
# compile-time key below and is applied on the next boot. Ship empty so no
# secret lives in the repo; provision over serial (README). Optionally bake the
# public Quickstart Shared Project key here as a convenience default.
CONFIG_MEMFAULT_PROJECT_KEY_SETTINGS=y
CONFIG_MEMFAULT_NCS_PROJECT_KEY="UQhnIEBjXEGBCb9s1AENeAYril4WE4cj"

# --- Settings storage + serial provisioning ---------------------------------
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
# Persistent settings backend. Without this the backend choice falls through to
# SETTINGS_NONE (a no-op) and writes fail with -ENOENT. ZMS is the backend for
# the nRF54L15's RRAM; it makes the choice default to SETTINGS_ZMS.
CONFIG_ZMS=y
# Provides `settings write/read/delete`
CONFIG_SETTINGS_SHELL=y
CONFIG_SHELL=y
# `kernel reboot cold` after provisioning
CONFIG_REBOOT=y
CONFIG_KERNEL_SHELL=y

# --- Unique device ID from FICR via hw_id (discoverable with nrfutil) -------
CONFIG_MEMFAULT_NCS_DEVICE_ID_HW_ID=y
CONFIG_HW_ID_LIBRARY_SOURCE_DEVICE_ID=y

# --- Device Information Service (metadata) ----------------------------------
CONFIG_BT_DIS=y
# NOTE: templating the DIS firmware-revision string from app/VERSION via
# CONFIG_BT_DIS_FW_REV_STR="$(APP_VERSION_STRING)" does NOT work — Kconfig
# $(...) expansion does not run on .conf fragment *values*, so the string stays
# literal (verified in autoconf.h during the NPE-1776 build). The authoritative
# version is reported by Memfault (CONFIG_MEMFAULT_NCS_FW_VERSION -> 1.0.0+0),
# which expands correctly because its $(...) lives in a Kconfig default.
