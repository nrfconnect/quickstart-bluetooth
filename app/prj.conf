# quickstart-bluetooth application configuration.
#
# peripheral_lbs base + Memfault observability over the MDS BLE gateway path.

# --- Base BLE + LBS ---------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SHELL=y
# MDS access control needs a secured link
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="Quickstart_Bluetooth"
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Quickstart Bluetooth"
CONFIG_BT_LBS=y
CONFIG_BT_LBS_POLL_BUTTON=y
CONFIG_DK_LIBRARY=y

# --- MDS gateway path -------------------------------------------------------
# The device serves Memfault chunks to the gateway; no on-device HTTP/TLS.
CONFIG_BT_MDS=y
# Drain chunks ~1s for a snappy demo
CONFIG_BT_MDS_DATA_POLL_INTERVAL=1000

# --- Memfault core ----------------------------------------------------------
CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_SHELL=y
# Without CONFIG_LOG, Memfault's log macros (used by e.g. `mflt get_device_info`,
# `mflt metrics_dump`) fall back to bare printk() (see
# MEMFAULT_PLATFORM_LOG_FALLBACK_TO_PRINTK), which is not coordinated with the
# interrupt-driven shell backend and gets silently dropped while a shell
# command is executing. Enabling LOG routes them through the log subsystem,
# which the shell backend explicitly multiplexes with the prompt.
CONFIG_LOG=y
CONFIG_MEMFAULT_NCS_FW_TYPE="main"
# Version derives from app/VERSION; do not hardcode it. app/Kconfig
# sets the reported version to $(APPVERSION) (e.g. 1.0.0 / 1.0.0-rc1).
CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC=y
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=60
CONFIG_MEMFAULT_EVENT_STORAGE_SIZE=4096
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP=y
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP_SIZE=8192

# --- Runtime project key -------------
# A key stored at the settings key `memfault/project_key` overrides the
# compile-time key below and is applied on the next boot.
CONFIG_MEMFAULT_PROJECT_KEY_SETTINGS=y
CONFIG_MEMFAULT_NCS_PROJECT_KEY="placeholder"

# --- Settings storage + serial provisioning ---------------------------------
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_ZMS=y
# Provides `settings write/read/delete`
CONFIG_SETTINGS_SHELL=y
CONFIG_SHELL=y
# `kernel reboot cold` after provisioning
CONFIG_REBOOT=y
CONFIG_KERNEL_SHELL=y

# --- Unique device ID from FICR via hw_id (discoverable with nrfutil) -------
CONFIG_MEMFAULT_NCS_DEVICE_ID_HW_ID=y
CONFIG_HW_ID_LIBRARY_SOURCE_DEVICE_ID=y

# --- Device Information Service (metadata) ----------------------------------
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME_STR="Nordic Semiconductor"
# Hardware Revision instead of Model Number; Firmware Revision tracks app/VERSION.
CONFIG_BT_DIS_MODEL_NUMBER=n
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_HW_REV_STR="nrf54l15"
CONFIG_BT_DIS_FW_REV=y
# PnP_ID defaulted to an unrelated vendor (Ericsson) - not applicable here.
CONFIG_BT_DIS_PNP=n
