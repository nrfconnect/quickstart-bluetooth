# Hardware Revision reported over the BLE Device Information Service.
CONFIG_BT_DIS_HW_REV_STR="nrf54h20"

# Enable the radio core so sysbuild builds and flashes the ipc_radio image
# that provides the Bluetooth controller over HCI/IPC.
CONFIG_SOC_NRF54H20_CPURAD_ENABLE=y

# Power management (mirrors the peripheral_lbs sample defaults for this board).
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM=y
CONFIG_POWEROFF=y

# MRAM latency optimization - allow MRAM to power off when idle.
CONFIG_MRAM_LATENCY_AUTO_REQ=n

# Peak Current Management.
CONFIG_MPSL_FORCE_RRAM_ON_ALL_THE_TIME=n
