name: Build app

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Release version (vX.Y.Z[-suffix]). When set, app/VERSION is
          regenerated from it before the build so the firmware reports the
          release version to Memfault. When empty, the committed app/VERSION is
          built as-is (PR/push CI).
        type: string
        required: false
        default: ""
      artifact-name:
        description: Name of the uploaded hex+elf artifact.
        type: string
        required: false
        default: quickstart-bluetooth-nrf54l15dk
    secrets:
      MEMFAULT_PROJECT_KEY:
        description: Memfault project key baked into the build via CONFIG_QSBT_DEFAULT_PROJECT_KEY.
        required: true
    outputs:
      fw_version:
        description: Memfault software version reported by the build (CONFIG_MEMFAULT_NCS_FW_VERSION).
        value: ${{ jobs.build.outputs.fw_version }}
      fw_type:
        description: Memfault software type reported by the build (CONFIG_MEMFAULT_NCS_FW_TYPE).
        value: ${{ jobs.build.outputs.fw_type }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.0
    defaults:
      run:
        shell: bash
    outputs:
      fw_version: ${{ steps.fwver.outputs.fw_version }}
      fw_type: ${{ steps.fwver.outputs.fw_type }}
    steps:
      - name: Checkout (into the manifest-repo path from west.yml self.path)
        uses: actions/checkout@v7
        with:
          path: project
          persist-credentials: false

      - name: Set release version in app/VERSION
        if: inputs.version != ''
        run: |
          python3 project/scripts/app_version.py "${{ inputs.version }}" \
            > project/app/VERSION
          echo "Building app/VERSION:"
          cat project/app/VERSION

      - name: Initialise west workspace from the local manifest
        run: west init -l project

      - name: West update (shallow, against the pinned sdk-nrf SHA)
        run: west update --narrow -o=--depth=1

      - name: West zephyr-export
        run: west zephyr-export

      - name: Build for nrf54l15dk/nrf54l15/cpuapp
        # --no-sysbuild: plain app image, no MCUboot/sysbuild.
        run: |
          west build -b nrf54l15dk/nrf54l15/cpuapp --no-sysbuild \
            project/app \
            -- \
            -DCONFIG_QSBT_DEFAULT_PROJECT_KEY=\"${{ secrets.MEMFAULT_PROJECT_KEY }}\"

      - name: Read Memfault software version/type from the build config
        id: fwver
        # The exact strings the firmware reports, so Memfault symbol uploads link
        # to the right software version (no guessing the Zephyr format).
        run: |
          CONF=build/zephyr/.config
          VER=$(sed -nE 's/^CONFIG_MEMFAULT_NCS_FW_VERSION="(.*)"$/\1/p' "$CONF")
          TYPE=$(sed -nE 's/^CONFIG_MEMFAULT_NCS_FW_TYPE="(.*)"$/\1/p' "$CONF")
          echo "fw_version=$VER" >> "$GITHUB_OUTPUT"
          echo "fw_type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Memfault software: type=$TYPE version=$VER"

      - name: Install SBOM (west ncs-sbom) dependencies
        # scancode-toolkit (one of the default license detectors) needs these
        # system libs on top of its pip deps. See:
        # https://nrfconnectdocs.nordicsemi.com/ncs/latest/nrf/scripts/west_commands/sbom/README.html
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-dev bzip2 xz-utils zlib1g libxml2-dev libxslt1-dev libpopt0
          pip3 install --quiet -r nrf/scripts/requirements-west-ncs-sbom.txt

      - name: Generate SPDX SBOM
        run: |
          west ncs-sbom -d build \
            --package-supplier "Nordic Semiconductor ASA" \
            --output-spdx build/zephyr/quickstart-bluetooth.spdx

      - name: Upload build artifacts (hex + elf + spdx)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            build/zephyr/zephyr.hex
            build/zephyr/zephyr.elf
            build/zephyr/quickstart-bluetooth.spdx
          if-no-files-found: error
