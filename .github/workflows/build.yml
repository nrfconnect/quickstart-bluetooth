# PR/push CI: build the quickstart-bluetooth application against the pinned
# sdk-nrf SHA so regressions are caught on every PR. This is a thin
# caller of the reusable build-app.yml — with no `version` input it builds the
# committed app/VERSION as-is. The build steps and toolchain pin live in
# build-app.yml so CI and release.yml can never drift apart.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      # Supported boards. Keep in sync with the matrix in release.yml.
      # board-id (<board>-<chip>) is used for artifact/release file names.
      # sysbuild=true for nRF54H20 (multi-core: BLE controller on cpurad).
      matrix:
        include:
          - board: nrf54l15dk/nrf54l15/cpuapp
            board-id: nrf54l15dk-nrf54l15
            sysbuild: false
          - board: nrf54lm20dk/nrf54lm20a/cpuapp
            board-id: nrf54lm20dk-nrf54lm20a
            sysbuild: false
          - board: nrf54h20dk/nrf54h20/cpuapp
            board-id: nrf54h20dk-nrf54h20
            sysbuild: true
    uses: ./.github/workflows/build-app.yml
    with:
      board: ${{ matrix.board }}
      board-id: ${{ matrix.board-id }}
      sysbuild: ${{ matrix.sysbuild }}
    secrets:
      MEMFAULT_PROJECT_KEY: ${{ secrets.MEMFAULT_PROJECT_KEY }}

# Follow-ups (out of scope for this workflow, tracked separately):
#   - twister build-only smoke test once a testcase/sample.yaml exists.
