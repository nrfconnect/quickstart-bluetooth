# PR/push CI: build the quickstart-bluetooth application against the pinned
# sdk-nrf SHA so regressions are caught on every PR. Matrixed over both
# supported boards. This is a thin caller of the reusable build-app.yml — with
# no `version` input it builds the committed app/VERSION as-is. The build
# steps and toolchain pin live in build-app.yml so CI and release.yml can
# never drift apart.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nrf54l15dk/nrf54l15/cpuapp
            sysbuild: false
            artifact-name: quickstart-bluetooth-nrf54l15dk
          - board: nrf54lm20dk/nrf54lm20a/cpuapp/ns
            sysbuild: true
            artifact-name: quickstart-bluetooth-nrf54lm20dk
    uses: ./.github/workflows/build-app.yml
    with:
      board: ${{ matrix.board }}
      sysbuild: ${{ matrix.sysbuild }}
      artifact-name: ${{ matrix.artifact-name }}
    secrets:
      MEMFAULT_PROJECT_KEY: ${{ secrets.MEMFAULT_PROJECT_KEY }}

# Follow-ups (out of scope for this workflow, tracked separately):
#   - twister build-only smoke test once a testcase/sample.yaml exists.
