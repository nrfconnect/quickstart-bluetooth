# Release pipeline for quickstart-bluetooth.
#
# Manually dispatched. Given a release version string it:
#   1. validates the version format and derives the git tag + Memfault software
#      version (scripts/app_version.py);
#   2. builds the firmware with app/VERSION set to that version (build-app.yml),
#      so the device reports the release version to Memfault;
#   3. zips zephyr.hex + zephyr.elf;
#   4. uploads zephyr.elf as symbols to the Memfault "quickstart-shared-project"
#      (registers the software version for symbolication);
#   5. tags the target commit and creates a GitHub release with the zip attached.
#
# The version input is the single knob — do NOT hardcode versions elsewhere; the
# committed app/VERSION stays at 0.0.0-dev and is overwritten at build time.
#
# dry_run performs steps 1-4 (validate, build, zip, Memfault upload) but SKIPS
# the git tag and GitHub release, so you can prove VERSION generation and build
# output before cutting a real release. The built zip is uploaded as a workflow
# artifact in every run for inspection.
#
# Required repository configuration:
#   secret MEMFAULT_ORG_TOKEN  Organization Auth Token (Bearer) with upload rights
#   var    MEMFAULT_ORG_SLUG   Memfault organization slug (from the dashboard URL)
# (GITHUB_TOKEN is provided automatically; contents:write lets it tag + release.)

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.2.3 or v1.2.3-rc1"
        type: string
        required: true
      sha:
        description: "Commit SHA to tag/release (default: latest commit on this ref)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Dry-run (skip git tag and release)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write # tag push + release creation

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version and derive tag
        id: parse
        # scripts/app_version.py exits non-zero on a malformed version string,
        # failing the whole run before anything is built or published.
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          python3 scripts/app_version.py "$VERSION" >/dev/null
          TAG=$(python3 scripts/app_version.py "$VERSION" --mode tag)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

  build:
    needs: validate
    uses: ./.github/workflows/build-app.yml
    with:
      version: ${{ inputs.version }}

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Python (isolated interpreter for memfault-cli)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download build artifacts (hex + elf)
        uses: actions/download-artifact@v8
        with:
          name: quickstart-bluetooth-nrf54l15dk
          path: artifacts

      - name: Locate build outputs
        id: files
        run: |
          set -euo pipefail
          HEX=$(find artifacts -name zephyr.hex | head -n1)
          ELF=$(find artifacts -name zephyr.elf | head -n1)
          test -n "$HEX" && test -n "$ELF"
          echo "hex=$HEX" >> "$GITHUB_OUTPUT"
          echo "elf=$ELF" >> "$GITHUB_OUTPUT"

      - name: Package release zip
        id: zip
        run: |
          set -euo pipefail
          ZIP="quickstart-bluetooth-${{ needs.validate.outputs.tag }}.zip"
          zip -j "$ZIP" "${{ steps.files.outputs.hex }}" "${{ steps.files.outputs.elf }}"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload zip as workflow artifact (always, for inspection)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.zip.outputs.zip }}
          path: ${{ steps.zip.outputs.zip }}
          if-no-files-found: error

      - name: Upload symbols to Memfault
        # Software type/version come from the build config so the symbol file is
        # linked to the version the device reports. --check-uploaded skips
        # symbols already uploaded (idempotent re-runs).
        env:
          MEMFAULT_ORG_TOKEN: ${{ secrets.MEMFAULT_ORG_TOKEN }}
          MEMFAULT_ORG_SLUG: ${{ secrets.MEMFAULT_ORG_SLUG }}
          MEMFAULT_PROJECT: ${{ secrets.MEMFAULT_PROJECT }}
        run: |
          set -euo pipefail
          pip install --quiet memfault-cli
          memfault \
            --org-token "$MEMFAULT_ORG_TOKEN" \
            --org "$MEMFAULT_ORG_SLUG" \
            --project "$MEMFAULT_PROJECT" \
            upload-mcu-symbols \
            --software-type "${{ needs.build.outputs.fw_type }}" \
            --software-version "${{ needs.build.outputs.fw_version }}" \
            --check-uploaded \
            "${{ steps.files.outputs.elf }}"

      - name: Create or update GitHub release (also creates the tag)
        if: ${{ !inputs.dry_run }}
        # gh release create makes the tag via the Releases API. Unlike git push,
        # that path is not blocked by the GITHUB_TOKEN workflow-file restriction,
        # so it works even when the target commit's workflows differ from main.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }} # gh has no checkout to infer the repo from
          TAG: ${{ needs.validate.outputs.tag }}
          ZIP: ${{ steps.zip.outputs.zip }}
          TARGET_SHA: ${{ inputs.sha != '' && inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          # A tag with a suffix (e.g. v1.2.3-rc1) is a pre-release.
          PRERELEASE=""
          if [[ "$TAG" == *-* ]]; then PRERELEASE="--prerelease"; fi
          # Idempotent: create if missing, else re-attach the zip (--clobber) so
          # re-running an existing version refreshes the asset instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$TARGET_SHA" \
              --title "$TAG" --generate-notes $PRERELEASE
          fi

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "DRY RUN: skipped git tag and GitHub release for ${{ needs.validate.outputs.tag }}."
          echo "Built + zipped ${{ steps.zip.outputs.zip }} and uploaded symbols to Memfault."
